name: Tests

# Runs on every push and pull request, so a broken change is caught before it
# is tagged and shipped to everyone's phone. (desktop-release.yml only runs on
# a version tag — by then it's too late to find out the API test was red.)
#
# Four jobs, fastest first:
#   unit      pure logic, no network: alerts, hourly strip, formatting, the weather-provider client, the
#             local database (forecast cache, My Location), the widget's hand-over and the service worker —
#             plus the sync engine against the real server code, with several simulated devices, and the
#             one-time migration of the old server database.
#   android   the native code: compiles it, links every resource (so a broken
#             layout/manifest/translation fails here, not on the release tag), and
#             runs the JVM tests for the widget's decision logic and its weather parsing.
#   api       the real backend (accounts' city/settings sync) over HTTP. No browser, no third party.
#   browser   the built frontend in headless Chrome against the real backend and
#             the real quarc-auth service (checked out from the Quarc_Store repo).
#
# The browser job calls live third-party services (Open-Meteo, and for the radar
# suite RainViewer/Esri), exactly like running the suites by hand — "the
# interesting failures live in the seams". A genuine upstream outage will turn
# them red; re-run once before assuming it's the code.

on:
  push:
    # offline-sync: the branch the offline/sync work is developed on, so it is tested before it is merged.
    branches: [main, offline-sync]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package.json
            frontend/package.json
      # The frontend's own modules are what is under test (Dexie + fake-indexeddb for the local database), and
      # the sync suites run the real server code (better-sqlite3), so both sets of dependencies are needed.
      - name: Install dependencies
        run: |
          npm install --prefix backend
          npm install --prefix frontend
      - name: Run unit tests
        run: >
          node --test
          tests/unit.test.js
          tests/unit-provider.test.js
          tests/unit-widget.test.js
          tests/unit-sw.test.js
          tests/local-services.test.js
          tests/migration.test.js
          tests/sync-sim.test.js

  android:
    name: Android (compile, resources, widget unit tests)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Same preparation the release build does (desktop-release.yml, build-android) —
      # the Gradle project depends on the web bundle and on Capacitor's generated files.
      - name: Build the frontend and sync Capacitor
        run: |
          npm install --prefix frontend
          npm run build --prefix frontend
          cp -r frontend/dist/* mobile/www/
          npm install --prefix mobile
          (cd mobile && npx cap sync android)

      - name: Compile, link resources, run the JVM unit tests
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --console=plain :app:testDebugUnitTest :app:assembleDebug

      - name: Test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report
          path: mobile/android/app/build/reports/tests
          if-no-files-found: ignore

  api:
    name: Sync API tests (real backend)
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: testsecret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Start the backend (scratch database)
        run: |
          PORT=3904 DB_PATH="$RUNNER_TEMP/weather.db" node backend/src/index.js > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3904/api/health && exit 0
            sleep 1
          done
          echo "backend never came up"; cat "$RUNNER_TEMP/backend.log"; exit 1

      # The server now only holds accounts' cities and settings (weather comes straight from the provider
      # to the device), so this is the whole of its API: auth gate, per-user isolation, push/pull, last-
      # writer-wins, tombstones, validation, timestamp clamping.
      - name: Sync API suite
        run: NODE_PATH="$PWD/backend/node_modules" node tests/sync-api.test.js

      - name: Backend log (on failure)
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log"

  browser:
    name: Browser tests (headless Chrome)
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: testsecret
    steps:
      - uses: actions/checkout@v4

      # quarc-auth (the shared login) lives in the Quarc_Store repo. If that repo
      # is private, add a read-only personal access token as the repository
      # secret QUARC_STORE_TOKEN; if it is public the default token is enough.
      - name: Check out Quarc_Store (for quarc-auth)
        uses: actions/checkout@v4
        with:
          repository: zekicandemiralay/Quarc_Store
          path: quarc-store
          token: ${{ secrets.QUARC_STORE_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install --prefix backend
          npm install --prefix frontend
          npm install --prefix quarc-store/auth
          npm install --prefix "$RUNNER_TEMP/pptr" puppeteer

      - name: Build the frontend
        run: npm run build --prefix frontend

      - name: Start quarc-auth, the backend and the frontend
        run: |
          PORT=3902 SECURE_COOKIE=false ADMIN_USERNAME=zeki ADMIN_PASSWORD=testpass123 \
            DB_PATH="$RUNNER_TEMP/auth.db" node quarc-store/auth/src/index.js > "$RUNNER_TEMP/auth.log" 2>&1 &
          PORT=3904 DB_PATH="$RUNNER_TEMP/weather.db" node backend/src/index.js > "$RUNNER_TEMP/backend.log" 2>&1 &
          (cd frontend && node node_modules/vite/bin/vite.js preview --port 4173 --host 127.0.0.1 > "$RUNNER_TEMP/vite.log" 2>&1 &)
          for url in http://127.0.0.1:3902/api/health http://127.0.0.1:3904/api/health http://127.0.0.1:4173/; do
            for i in $(seq 1 30); do curl -fsS "$url" >/dev/null && break; sleep 1; done
            curl -fsS "$url" >/dev/null || { echo "never came up: $url"; tail -n 30 "$RUNNER_TEMP"/*.log; exit 1; }
          done

      # location-ui reverse-geocodes a GPS point through OpenStreetMap's Nominatim (8 s timeout) and
      # fails from a GitHub runner while passing from a home connection. Nominatim was the first
      # suspect; this probe records what it actually does from the runner, as a public annotation.
      # (It answered 200 in ~0.5 s, so Nominatim alone is NOT the explanation — the suite's own failure
      # message now carries the geocode status codes and the page text to narrow it down.)
      - name: Probe Nominatim from this runner
        continue-on-error: true
        shell: bash
        run: |
          result=$(curl -s -o /dev/null -m 12 -w "HTTP %{http_code} in %{time_total}s"             -A "Quarc-Weather/1.0 (self-hosted personal weather app)"             "https://nominatim.openstreetmap.org/reverse?lat=41.0082&lon=28.9784&format=jsonv2&zoom=14" || echo "no response within 12s")
          echo "::notice title=Nominatim reverse-geocode from this runner::$result"

      # Open-Meteo is rate-limited per IP and a runner's IP is shared. This records its answer (and how
      # much quota is left) from here, so a "Forecast unavailable" failure can be told from a code bug.
      - name: Probe Open-Meteo from this runner
        continue-on-error: true
        shell: bash
        run: |
          result=$(curl -s -m 15 -o /dev/null -D "$RUNNER_TEMP/om.headers" -w "HTTP %{http_code} in %{time_total}s" \
            "https://api.open-meteo.com/v1/forecast?latitude=41.01&longitude=28.97&current=temperature_2m" || echo "no response within 15s")
          quota=$(grep -i "x-ratelimit-remaining" "$RUNNER_TEMP/om.headers" 2>/dev/null | tr -d '\r' | head -1)
          echo "::notice title=Open-Meteo forecast from this runner::$result ${quota}"

      # City search. Several suites' first attempt timed out waiting for search results from a runner while the
      # retry passed, and the forecast probe above was fine — so the geocoder is the suspect. This records its answer
      # from here (the same request the app makes), three times, so a throttled runner shows up as a number.
      # (The suites now replay one real answer per query instead of asking it again and again — tests/helpers/app.js.)
      - name: Probe the Open-Meteo geocoder from this runner
        continue-on-error: true
        shell: bash
        run: |
          out=""
          for i in 1 2 3; do
            r=$(curl -s -m 15 -o /dev/null -D "$RUNNER_TEMP/geo.headers" -w "HTTP %{http_code} in %{time_total}s" \
              "https://geocoding-api.open-meteo.com/v1/search?name=Berlin&count=5&language=en&format=json" || echo "no response within 15s")
            out="$out [$r]"
            sleep 2
          done
          quota=$(grep -i "x-ratelimit-remaining\|retry-after" "$RUNNER_TEMP/geo.headers" 2>/dev/null | tr -d '\r' | tr '\n' ' ')
          echo "::notice title=Open-Meteo geocoder from this runner::$out $quota"

      # Suites that only need our own stack.
      - name: Browser suites
        env:
          NODE_PATH: ${{ runner.temp }}/pptr/node_modules:${{ github.workspace }}/backend/node_modules
        shell: bash
        run: |
          # Run EVERY suite even if one fails, and name each failure in a public annotation
          # (job logs need a login to read; annotations don't) — so one red run shows all the
          # broken suites and the first failing check of each, instead of just "exit code 1".
          #
          # These suites hit the live Open-Meteo API from a runner whose IP is shared with many other
          # projects (Open-Meteo's free tier is rate-limited per IP), so a failed suite is retried ONCE
          # after a pause. A suite that only passes on the retry is reported as a warning — visible, not
          # silent — and a suite that fails twice is a real failure.
          failed=0
          for suite in ui timezone weather-screen widget-settings weather-effects daily-briefing offline-sync-ui; do
            echo "::group::$suite"
            passed=0
            first=""
            for attempt in 1 2; do
              if node "tests/$suite.test.js" 2>&1 | tee "$RUNNER_TEMP/suite-$suite-$attempt.log"; then
                passed=1
                break
              fi
              detail=$(grep -E "\[FAIL\]|Error|error:" "$RUNNER_TEMP/suite-$suite-$attempt.log" | head -4 | tr '\n' ' ' | cut -c1-700)
              if [ "$attempt" = "1" ]; then
                first="$detail"
                echo "attempt 1 of $suite failed — waiting 30s and retrying once"
                sleep 30
              fi
            done
            if [ "$passed" = "1" ] && [ "$attempt" = "2" ]; then
              echo "::warning title=Browser suite '$suite' passed only on retry::${first:-no [FAIL] line}"
            elif [ "$passed" = "0" ]; then
              failed=1
              echo "::error title=Browser suite '$suite' failed twice::${detail:-no [FAIL] line — see the job log}"
            fi
            echo "::endgroup::"
          done
          exit $failed

      # These depend on a live third party that isn't ours to keep up, so they report but don't block:
      #   radar         Esri / RainViewer tile servers
      #   update-banner the GitHub Releases API (rate-limited)
      #   location-ui   live Nominatim + Open-Meteo geocoding and timing; cause of its CI-only failure
      #                 at the "save Berlin" step not yet pinned down (see the probe above)
      - name: Live third-party suites (informational)
        # Run even when a blocking suite above failed, so one red run still reports these too.
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/pptr/node_modules:${{ github.workspace }}/backend/node_modules
        run: |
          for suite in radar update-banner location-ui; do
            echo "::group::$suite"
            if node "tests/$suite.test.js" 2>&1 | tee "$RUNNER_TEMP/suite-$suite.log"; then
              echo "$suite passed"
            else
              detail=$(grep -E "\[FAIL\]|Error|error:" "$RUNNER_TEMP/suite-$suite.log" | head -3 | tr '\n' ' ' | cut -c1-600)
              echo "::warning title=$suite failed (live third-party service)::${detail:-see the job log} — re-run before assuming it's the code"
            fi
            echo "::endgroup::"
          done

      - name: Screenshots (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshots
          path: tests/shots*
          if-no-files-found: ignore

      - name: Service logs (on failure)
        if: failure()
        run: tail -n 60 "$RUNNER_TEMP"/*.log
