name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.startsWith('refs/tags/')
              ? context.ref.replace('refs/tags/', '')
              : context.ref;
            const body = [
              '## Installation',
              '',
              '| Platform | File |',
              '|----------|------|',
              '| Android  | `Quarc-Weather-Android.apk` |',
              '| Windows  | `*_x64-setup.exe` |',
              '| macOS (Apple Silicon M1/M2/M3) | `*_aarch64.dmg` |',
              '| macOS (Intel) | `*_x64.dmg` |',
              '| Linux | `*_amd64.deb` or `*_amd64.AppImage` |',
              '',
              '**Android:** Enable "Install from unknown sources" for your file manager, then tap the APK to install.',
              '**iOS:** open the app URL in Safari and use Share → Add to Home Screen (no separate iOS build).',
              '**macOS note:** Right-click the app → Open the first time to bypass the unsigned app warning.',
              '**Sign-in:** use the same account as Quarc Music. Signing in, and syncing your cities and settings between devices, need Tailscale to be connected.',
              '**Android and Windows** keep working without Tailscale once you are signed in: the weather, city search and your saved cities are on the device, and changes sync the next time Tailscale is on. macOS and Linux open the web app through the server, so they need Tailscale.',
            ].join('\n');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Quarc Weather ${tag}`,
              body,
              draft: true,
              prerelease: false,
            });
            return data.id;

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: Windows
          - platform: macos-latest
            label: macOS (Apple Silicon)
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            label: macOS (Intel)
            rust-target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            label: Linux

    name: Build — ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install

      # Windows only: the app carries its own copy of the frontend (desktop/src-tauri/tauri.windows.conf.json
      # drops the window's server URL), so it opens and works without the Quarc server — weather and city search
      # come straight from the providers; the server is only needed to sign in and to sync. macOS and Linux keep
      # being a window onto the server's web app, so they skip this and ship the placeholder in desktop/dist.
      # Run INSIDE frontend/ rather than with `npm --prefix frontend`: on the Windows runner (Node 20, npm 10.8)
      # `--prefix` is ignored by `npm install`, which then looks for package.json in the repo root, installs nothing
      # and the build fails with "vite is not recognized". (The Linux jobs can use --prefix; Windows can't.)
      - name: Build the bundled frontend (Windows)
        if: matrix.platform == 'windows-latest'
        working-directory: frontend
        shell: bash
        env:
          VITE_API_URL: https://quarcnet0.tail84500c.ts.net:4002
        run: |
          npm install
          npm run build
          cp -r dist/* ../desktop/dist/

      - name: Set desktop version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: desktop/src-tauri
        shell: bash
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          node -e "const fs=require('fs'),c=JSON.parse(fs.readFileSync('tauri.conf.json','utf8'));c.version='${TAG}';fs.writeFileSync('tauri.conf.json',JSON.stringify(c,null,2)+'\n')"

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args || '' }}

  build-android:
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend for Android (bundled, points to server)
        working-directory: frontend
        env:
          VITE_API_URL: https://quarcnet0.tail84500c.ts.net:4002
        run: npm run build

      - name: Copy frontend build into Capacitor web dir
        run: cp -r frontend/dist/* mobile/www/

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm install

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Set version from tag
        working-directory: mobile/android
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          # MAJOR*10000 + MINOR*100 + PATCH (same as Quarc Music), so it always
          # grows. Just removing the dots went backwards (1.0.10 -> 1010, then
          # 1.1.0 -> 110), and Android refuses an update with a lower versionCode.
          # Needs MINOR and PATCH to stay under 100.
          IFS='.' read -r MAJOR MINOR PATCH <<< "$TAG"
          CODE=$((MAJOR * 10000 + MINOR * 100 + ${PATCH:-0}))
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$TAG\"/" app/build.gradle

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > mobile/android/app/release.keystore

      - name: Verify decoded keystore (hash only — never the secret; catches a bad KEYSTORE_BASE64 upload immediately instead of via a cryptic KeytoolException)
        run: |
          ls -la mobile/android/app/release.keystore
          sha256sum mobile/android/app/release.keystore

      - name: Build signed release APK
        working-directory: mobile/android
        env:
          KEYSTORE_PATH: release.keystore
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: quarc-weather
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: chmod +x gradlew && ./gradlew assembleRelease

      - name: Upload APK to release
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const data = fs.readFileSync('mobile/android/app/build/outputs/apk/release/app-release.apk');
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: parseInt(process.env.RELEASE_ID),
              name: 'Quarc-Weather-Android.apk',
              data,
            });

  publish-release:
    needs: [create-release, build, build-android]
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID,
              draft: false,
            });
